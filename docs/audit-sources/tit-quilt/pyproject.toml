[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tit-quilt"
version = "0.1.0"
description = "A terminal toolbox that outlives its terminal — the session is a graph, not a process."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SuperInstance" }]
keywords = ["terminal", "mcp", "graph", "provenance", "toolbox"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
tit = "tit_quilt.cli:main"

[tool.setuptools]
packages = ["tit_quilt"]
