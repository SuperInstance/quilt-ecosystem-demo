<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="cell" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B1A"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="river" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#164E63"/>
    </linearGradient>
    <linearGradient id="substrate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="trainer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <linearGradient id="bathy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="porch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5A0"/>
      <stop offset="100%" stop-color="#FF9A3C"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="320" fill="#0A0A14"/>
  <g fill="#FFF" opacity="0.4">
    <circle cx="40" cy="30" r="0.7"/>
    <circle cx="280" cy="20" r="0.5"/>
    <circle cx="580" cy="25" r="0.8"/>
    <circle cx="610" cy="80" r="0.6"/>
  </g>
  <!-- The inner sound, glowing at center -->
  <g filter="url(#glow2)">
    <circle cx="320" cy="160" r="65" fill="url(#inner)" opacity="0.5"/>
  </g>
  <circle cx="320" cy="160" r="40" fill="url(#inner)" stroke="#FFE5A0" stroke-width="2"/>
  <text x="320" y="155" text-anchor="middle" fill="#0A0A14" font-family="ui-sans-serif,system-ui" font-size="11" font-weight="bold">inner_sound.py</text>
  <text x="320" y="170" text-anchor="middle" fill="#1A1A2E" font-family="ui-monospace,monospace" font-size="9">7.6KB, 171 lines</text>
  <text x="320" y="183" text-anchor="middle" fill="#1A1A2E" font-family="ui-sans-serif,system-ui" font-size="8" font-style="italic">8 tests, 6 packages</text>
  <!-- 6 packages around the inner sound -->
  <g font-family="ui-sans-serif,system-ui" font-size="10" font-weight="bold">
    <!-- top-left: cell-runtime -->
    <rect x="40" y="20" width="140" height="44" rx="6" fill="url(#cell)" opacity="0.92"/>
    <text x="110" y="40" text-anchor="middle" fill="#FFF">cell-runtime</text>
    <text x="110" y="55" text-anchor="middle" fill="#FFE5A0" font-family="ui-monospace,monospace" font-size="8" font-weight="normal">8-primitive cell</text>
    <!-- top-right: river-dream-log -->
    <rect x="460" y="20" width="140" height="44" rx="6" fill="url(#river)" opacity="0.92"/>
    <text x="530" y="40" text-anchor="middle" fill="#FFF">river-dream-log</text>
    <text x="530" y="55" text-anchor="middle" fill="#CFFAFE" font-family="ui-monospace,monospace" font-size="8" font-weight="normal">Hold / Wake / Dawn</text>
    <!-- middle-left: quilt-substrate -->
    <rect x="20" y="120" width="160" height="44" rx="6" fill="url(#substrate)" opacity="0.92"/>
    <text x="100" y="140" text-anchor="middle" fill="#FFF">quilt-substrate</text>
    <text x="100" y="155" text-anchor="middle" fill="#D1FAE5" font-family="ui-monospace,monospace" font-size="8" font-weight="normal">11-prim + 8 openers + 3 JEPAs</text>
    <!-- middle-right: substrate-trainer -->
    <rect x="460" y="120" width="160" height="44" rx="6" fill="url(#trainer)" opacity="0.92"/>
    <text x="540" y="140" text-anchor="middle" fill="#FFF">substrate-trainer</text>
    <text x="540" y="155" text-anchor="middle" fill="#F3E8FF" font-family="ui-monospace,monospace" font-size="8" font-weight="normal">JEPA on witness log</text>
    <!-- bottom-left: quilt-bathy -->
    <rect x="40" y="240" width="140" height="44" rx="6" fill="url(#bathy)" opacity="0.92"/>
    <text x="110" y="260" text-anchor="middle" fill="#FFF">quilt-bathy</text>
    <text x="110" y="275" text-anchor="middle" fill="#E0E7FF" font-family="ui-monospace,monospace" font-size="8" font-weight="normal">depth + convoy tool</text>
    <!-- bottom-right: porch -->
    <rect x="460" y="240" width="140" height="44" rx="6" fill="url(#porch)" opacity="0.92"/>
    <text x="530" y="260" text-anchor="middle" fill="#FFF">porch</text>
    <text x="530" y="275" text-anchor="middle" fill="#FEF3C7" font-family="ui-monospace,monospace" font-size="8" font-weight="normal">3am thoughts CLI</text>
  </g>
  <!-- arrows inward to inner_sound -->
  <g stroke="#FFE5A0" stroke-width="1.5" fill="none" opacity="0.55" stroke-dasharray="3 3">
    <path d="M 180,42 L 282,148"/>
    <path d="M 460,42 L 358,148"/>
    <path d="M 180,142 L 280,158"/>
    <path d="M 460,142 L 360,158"/>
    <path d="M 180,262 L 282,178"/>
    <path d="M 460,262 L 358,178"/>
  </g>
  <!-- title -->
  <text x="320" y="305" text-anchor="middle" fill="#FFE5A0" font-family="ui-sans-serif,system-ui" font-size="13" font-weight="600" letter-spacing="0.05em">SIX PACKAGES · ONE INNER SOUND</text>
</svg>
