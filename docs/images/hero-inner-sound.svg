<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <radialGradient id="tablet" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#FFE5A0" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FF9A3C" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0A0A14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="voice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="gesture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="witness" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <linearGradient id="midi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="rest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#164E63"/>
    </linearGradient>
    <linearGradient id="mud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="plato" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A0A14"/>
      <stop offset="50%" stop-color="#0E1A2E"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="320" fill="url(#sea)"/>
  <!-- sea stars -->
  <g fill="#FFF" opacity="0.5">
    <circle cx="40" cy="30" r="0.8"/>
    <circle cx="120" cy="50" r="1.0"/>
    <circle cx="280" cy="20" r="0.6"/>
    <circle cx="450" cy="40" r="0.9"/>
    <circle cx="580" cy="25" r="0.7"/>
    <circle cx="610" cy="80" r="1.1"/>
    <circle cx="80" cy="280" r="0.5"/>
    <circle cx="600" cy="260" r="0.7"/>
  </g>
  <!-- gentle wave lines -->
  <g stroke="#3B82F6" stroke-width="1" fill="none" opacity="0.25">
    <path d="M 0,280 Q 160,272 320,280 T 640,280"/>
    <path d="M 0,295 Q 160,288 320,295 T 640,295"/>
  </g>
  <!-- the 12-inch tablet at the center, glowing -->
  <g filter="url(#glow)">
    <circle cx="320" cy="200" r="80" fill="url(#tablet)" opacity="0.6"/>
  </g>
  <rect x="270" y="155" width="100" height="70" rx="6" fill="#1A1A2E" stroke="#FF9A3C" stroke-width="2"/>
  <text x="320" y="195" text-anchor="middle" fill="#FFE5A0" font-family="ui-monospace,monospace" font-size="11" font-weight="bold">F/V EILEEN</text>
  <text x="320" y="210" text-anchor="middle" fill="#FF9A3C" font-family="ui-monospace,monospace" font-size="9">12-inch tablet</text>
  <!-- 8 tendrils to the 8 openers around the tablet -->
  <g filter="url(#glow)" opacity="0.85">
    <path d="M 320,180 Q 230,140 95,90" stroke="url(#chart)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 320,180 Q 410,140 545,90" stroke="url(#voice)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 280,160 Q 200,110 65,140" stroke="url(#gesture)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 360,160 Q 440,110 575,140" stroke="url(#witness)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 270,210 Q 180,240 55,235" stroke="url(#midi)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 370,210 Q 460,240 585,235" stroke="url(#rest)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 290,225 Q 200,275 75,280" stroke="url(#mud)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 350,225 Q 440,275 565,280" stroke="url(#plato)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 8 opener labels -->
  <g font-family="ui-sans-serif,system-ui" font-size="10" font-weight="bold">
    <rect x="20" y="60" width="80" height="36" rx="4" fill="url(#chart)" opacity="0.9"/>
    <text x="60" y="82" text-anchor="middle" fill="#FFF">CHART</text>
    <rect x="540" y="60" width="80" height="36" rx="4" fill="url(#voice)" opacity="0.9"/>
    <text x="580" y="82" text-anchor="middle" fill="#FFF">VOICE</text>
    <rect x="0" y="120" width="80" height="36" rx="4" fill="url(#gesture)" opacity="0.9"/>
    <text x="40" y="142" text-anchor="middle" fill="#FFF">GESTURE</text>
    <rect x="560" y="120" width="80" height="36" rx="4" fill="url(#witness)" opacity="0.9"/>
    <text x="600" y="142" text-anchor="middle" fill="#FFF">WITNESS</text>
    <rect x="0" y="220" width="80" height="36" rx="4" fill="url(#midi)" opacity="0.9"/>
    <text x="40" y="242" text-anchor="middle" fill="#FFF">MIDI</text>
    <rect x="560" y="220" width="80" height="36" rx="4" fill="url(#rest)" opacity="0.9"/>
    <text x="600" y="242" text-anchor="middle" fill="#FFF">REST</text>
    <rect x="20" y="270" width="80" height="36" rx="4" fill="url(#mud)" opacity="0.9"/>
    <text x="60" y="292" text-anchor="middle" fill="#FFF">MUD</text>
    <rect x="540" y="270" width="80" height="36" rx="4" fill="url(#plato)" opacity="0.9"/>
    <text x="580" y="292" text-anchor="middle" fill="#FFF">PLATO</text>
  </g>
  <!-- Reyes's boat silhouette at the bottom -->
  <g fill="#1E3A5F" stroke="#3B82F6" stroke-width="1">
    <path d="M 280,310 L 360,310 L 350,318 L 290,318 Z"/>
  </g>
  <text x="320" y="315" text-anchor="middle" fill="#FFE5A0" font-family="ui-sans-serif,system-ui" font-size="7" font-style="italic">reyes @ inner sound</text>
</svg>
